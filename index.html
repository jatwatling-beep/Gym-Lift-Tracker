<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Lift Tracker</title>
  <meta name="theme-color" content="#111318">
  <meta name="description" content="Track your gym lifts, offline and on-device.">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Tracker">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn" hidden aria-label="Back">&larr;</button>
    <h1 id="pageTitle">Lift Tracker</h1>
    <button id="addLiftBtn" class="icon-btn" aria-label="Add lift">+</button>
  </header>

  <main id="app"></main>

  <div id="sheetOverlay" class="overlay" hidden>
    <div id="sheet" class="sheet"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
